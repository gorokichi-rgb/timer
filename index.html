:root{--bg:#E5E5E5;--ac:#A499C9;--card:#F1EEF8;--ink:#111;--sub:#555;--line:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1d22;--card:#2b2838;--ink:#f2f2f2;--sub:#aaa;--line:#cfcfcf}}
:root[data-theme="dark"]{--bg:#1d1d22;--card:#2b2838;--ink:#f2f2f2;--sub:#aaa;--line:#cfcfcf}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"SS","Source Sans 3",system-ui,-apple-system,"Hiragino Sans",sans-serif;font-weight:300;min-height:100vh}
.screen{max-width:480px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:15px;font-weight:300;letter-spacing:.3em;text-transform:uppercase;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:none;padding:10px 14px}
.dots{display:flex;flex-direction:column;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card b{display:block;font-size:18px;font-weight:400}
.card span{color:var(--sub);font-size:14px}
.list>.row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.list .card{flex:1}
.del{background:none;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;font-size:16px;line-height:1}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:transparent;border:1px solid var(--line);font-size:32px;font-weight:300;line-height:1}
.chip{font-size:12px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.chip.run{background:var(--ac)}
.orb{width:150px;height:150px;border-radius:50%;margin:4px auto 14px;background:radial-gradient(circle at 50% 50%,#D3CFDF 0%,#B6AED0 60%,#AFA6CE 100%)}
.orb.run{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.big{font-size:84px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0 18px;line-height:1.1}
.big.paused{opacity:.45}.big.end{color:var(--ac)}
.seg{margin-bottom:12px}
.segTop{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:22px}
.bar.thin{height:6px;margin-bottom:0}
.fill{height:100%;width:0;background:var(--ac)}
.mk{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.5}
.btn{padding:12px 0;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:17px;font-weight:400;letter-spacing:.04em}
.btn.main{background:var(--ac)}
.lapbig{display:block;width:72%;margin:6px auto 10px;background:var(--ac)}
.lapbig:disabled{opacity:.4;background:transparent}
.btns{display:flex;gap:10px;width:72%;margin:0 auto 22px}
.btns .btn{flex:1}
.lap{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:10px 2px;font-size:16px;font-variant-numeric:tabular-nums}
.lap small{color:var(--sub)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);width:min(340px,90vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog b{font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input[type=range]{width:100%;accent-color:var(--ac)}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.sw input{width:22px;height:22px;accent-color:var(--ac)}
.acts{display:flex;gap:10px;margin-top:18px}.acts .btn{flex:1;padding:10px 0}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="home" class="screen">
  <header><h1 data-i="title"></h1><button class="ghost" id="menuBtn" aria-label="Menu"><span class="dots"><i></i><i></i><i></i></span></button></header>
  <div id="presetList" class="list"></div>
  <button class="fab" id="addBtn" aria-label="+">+</button>
</section>

<section id="run" class="screen" hidden>
  <header><h1 id="runTitle"></h1><span class="chip" id="chip"></span></header>
  <div class="orb" id="orb"></div>
  <div class="big" id="remain">70:00</div>
  <div class="seg"><div class="segTop"><span id="segName"></span><span id="segLeft"></span></div><div class="bar thin"><div class="fill" id="segFill"></div></div></div>
  <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  <button class="btn lapbig" id="lapBtn" data-i="lap"></button>
  <div class="btns">
    <button class="btn main" id="startBtn"></button>
    <button class="btn" id="resetBtn" data-i="reset"></button>
  </div>
  <div id="laps"></div>
</section>

<dialog id="addDlg">
  <b data-i="addT"></b>
  <label data-i="name"></label><input type="text" id="pName" data-p="ph">
  <label data-i="tot"></label><input type="number" id="pTotal" value="70" min="1">
  <label data-i="int"></label><input type="number" id="pInt" value="15" min="0">
  <div class="acts"><button class="btn" id="addCancel" data-i="cancel"></button><button class="btn main" id="addOk" data-i="save"></button></div>
</dialog>

<dialog id="setDlg">
  <b data-i="set"></b>
  <label data-i="lang"></label>
  <select id="langSel"><option value="en">English</option><option value="nl">Nederlands</option></select>
  <div class="sw"><span data-i="vib"></span><input type="checkbox" id="vibChk"></div>
  <label data-i="vol"></label><input type="range" id="vol" min="0.05" max="1" step="0.05">
  <div class="acts"><button class="btn" id="testBtn" data-i="test"></button><button class="btn main" id="setOk" data-i="close"></button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const I={
en:{title:"Timer",min:"min",every:"every",nocue:"no cue",idle:"Ready",run:"Running",pau:"Paused",end:"Done",sec:"Section",left:"Left",lap:"Lap",dur:"Duration",start:"Start",pause:"Pause",resume:"Resume",reset:"Reset",addT:"Add preset",name:"Name",ph:"e.g. Past paper 70 min",tot:"Total time (min)",int:"Cue interval (min, 0 = none)",cancel:"Cancel",save:"Save",set:"Settings",lang:"Language",vib:"Vibration",vol:"Cue volume",test:"Test sound",close:"Close"},
nl:{title:"Timer",min:"min",every:"elke",nocue:"geen signaal",idle:"Wachten",run:"Bezig",pau:"Gepauzeerd",end:"Klaar",sec:"Deel",left:"Nog",lap:"Ronde",dur:"Duur",start:"Start",pause:"Pauze",resume:"Hervat",reset:"Reset",addT:"Preset toevoegen",name:"Naam",ph:"bijv. Oefenexamen 70 min",tot:"Totale tijd (min)",int:"Signaalinterval (min, 0 = geen)",cancel:"Annuleren",save:"Opslaan",set:"Instellingen",lang:"Taal",vib:"Trillen",vol:"Volume van het signaal",test:"Geluid testen",close:"Sluiten"}};
let S={presets:[{n:"",t:70,i:15},{n:"",t:30,i:10}],vib:true,vol:0.4,lang:"en"};
try{const j=JSON.parse(localStorage.getItem("timerUI2")||"null");if(j)S=Object.assign(S,j)}catch(e){}
const save=()=>{try{localStorage.setItem("timerUI2",JSON.stringify(S))}catch(e){}};
const T=k=>I[S.lang][k];
const p2=n=>String(n).padStart(2,"0");
const f=ms=>{const s=Math.max(0,Math.floor(ms/1000));return p2(Math.floor(s/60))+":"+p2(s%60)};
const pn=p=>p.n||(p.t+" "+T("min"));

function renderHome(){
  $("presetList").innerHTML="";
  S.presets.forEach((p,k)=>{
    const r=document.createElement("div");r.className="row";
    r.innerHTML='<button class="card"><b></b><span></span></button><button class="del" aria-label="x">×</button>';
    r.querySelector("b").textContent=pn(p);
    r.querySelector("span").textContent=p.t+" "+T("min")+" · "+(p.i?T("every")+" "+p.i+" "+T("min"):T("nocue"));
    r.querySelector(".card").onclick=()=>openRun(p);
    r.querySelector(".del").onclick=()=>{if(confirm((S.lang==="nl"?"“"+pn(p)+"” verwijderen?":"Delete “"+pn(p)+"”?"))){S.presets.splice(k,1);save();renderHome()}};
    $("presetList").appendChild(r);
  });
}
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=T(e.dataset.p));
  $("langSel").value=S.lang;renderHome();
}
function show(id){$("home").hidden=id!=="home";$("run").hidden=id!=="run"}
addEventListener("popstate",()=>{stopAll();show("home")});

let P,ctx,running=false,startAt=0,acc=0,lastLap=0,fired=0,done=false,laps=[],iv=null,shown=-1;
const el=()=>acc+(running?Date.now()-startAt:0);
function openRun(p){
  P=p;history.pushState({run:1},"");show("run");
  $("runTitle").textContent=pn(p);reset();
  $("bar").querySelectorAll(".mk").forEach(m=>m.remove());
  if(p.i)for(let m=p.i;m<p.t;m+=p.i){const d=document.createElement("div");d.className="mk";d.style.left=(m/p.t*100)+"%";$("bar").appendChild(d)}
}
function stopAll(){running=false;clearInterval(iv);clearSched()}
function reset(){stopAll();acc=0;lastLap=0;fired=0;done=false;laps=[];shown=-1;draw()}
/* 音：区切り=ピピ、終了=ピピピ×3。音は先に予約するので、画面が重くなってもずれにくい */
let sched=[],master=null;
function tone(t,freq,gm){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=freq;o.connect(g);g.connect(master);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gm,t+0.015);g.gain.linearRampToValueAtTime(0,t+0.13);
  o.start(t);o.stop(t+0.15);sched.push(o);
}
function cueAt(d){const t=ctx.currentTime+d;tone(t,880,0.7);tone(t+0.22,880,0.7)}
function endAt(d){const t=ctx.currentTime+d;for(let g=0;g<3;g++)for(let k=0;k<3;k++)tone(t+g*1.0+k*0.22,1040,1)}
function clearSched(){sched.forEach(o=>{try{o.stop()}catch(x){}});sched=[]}
function scheduleAll(){
  clearSched();if(!ctx||!P)return;
  const e=el();
  if(P.i)for(let m=P.i;m<P.t;m+=P.i){const d=m*60000-e;if(d>0)cueAt(d/1000)}
  const d=P.t*60000-e;if(d>0)endAt(d/1000);
}
const vib=a=>{if(S.vib&&navigator.vibrate)navigator.vibrate(a)};
const audio=()=>{if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=S.vol;master.connect(ctx.destination)}catch(e){}}if(ctx&&ctx.state==="suspended")ctx.resume()};
function tick(){
  const e=el(),TT=P.t*60000;
  if(P.i){const k=Math.floor(e/(P.i*60000));if(k>fired&&e<TT){fired=k;vib([100,60,100])}}
  if(e>=TT&&!done){done=true;acc=TT;running=false;clearInterval(iv);vib([150,80,150,80,150,400,150,80,150,80,150,400,150,80,150,80,150])}
  draw();
}
function draw(){
  const TT=P?P.t*60000:0,e=Math.min(el(),TT);
  $("remain").textContent=f(TT-e);
  $("fill").style.width=(TT?e/TT*100:0)+"%";
  const sg=P&&P.i?P.i*60000:TT||1,n=Math.max(1,Math.ceil(TT/sg)),cur=Math.min(Math.floor(e/sg)+1,n),s0=(cur-1)*sg,s1=Math.min(cur*sg,TT);
  $("segName").textContent=T("sec")+" "+cur+" / "+n;
  $("segLeft").textContent=T("left")+" "+f(s1-e);
  $("segFill").style.width=(s1>s0?(e-s0)/(s1-s0)*100:0)+"%";
  const paused=e>0&&!running&&!done,ch=$("chip");
  ch.textContent=done?T("end"):running?T("run"):paused?T("pau"):T("idle");
  ch.className="chip"+(running?" run":"");
  $("orb").className="orb"+(running?" run":"");
  $("remain").className="big"+(paused?" paused":"")+(done?" end":"");
  $("lapBtn").disabled=!running;
  $("startBtn").textContent=done?T("end"):running?T("pause"):e>0?T("resume"):T("start");
  if(laps.length!==shown){shown=laps.length;
    $("laps").innerHTML=laps.map((l,k)=>'<div class="lap"><span>'+T("lap")+' '+(k+1)+'</span><span>'+f(l.a)+' → '+f(l.b)+'</span><span><small>'+T("dur")+'</small> '+f(l.b-l.a)+'</span></div>').reverse().join("");}
}
$("startBtn").onclick=()=>{
  if(done)return;audio();
  if(running){acc=el();stopAll()}
  else{startAt=Date.now();running=true;iv=setInterval(tick,200);scheduleAll()}
  draw();
};
$("lapBtn").onclick=()=>{if(!running)return;const e=el();laps.push({a:lastLap,b:e});lastLap=e;vib(40);draw()};
$("resetBtn").onclick=reset;

$("addBtn").onclick=()=>{$("pName").value="";$("addDlg").showModal()};
$("addCancel").onclick=()=>$("addDlg").close();
$("addOk").onclick=()=>{
  const t=Math.max(1,parseInt($("pTotal").value)||0),i=Math.max(0,parseInt($("pInt").value)||0);
  S.presets.push({n:$("pName").value.trim(),t,i});save();renderHome();$("addDlg").close();
};
$("menuBtn").onclick=()=>{$("vibChk").checked=S.vib;$("vol").value=S.vol;$("langSel").value=S.lang;$("setDlg").showModal()};
$("langSel").onchange=e=>{S.lang=e.target.value;save();applyLang()};
$("vibChk").onchange=e=>{S.vib=e.target.checked;save();if(S.vib)vib(80)};
$("vol").oninput=e=>{S.vol=+e.target.value;save();if(master)master.gain.value=S.vol};
$("testBtn").onclick=()=>{audio();if(ctx)cueAt(0)};
$("setOk").onclick=()=>$("setDlg").close();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
applyLang();
</script>
</body>
</html>
